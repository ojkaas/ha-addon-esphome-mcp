name: ESPHome MCP Server
version: 1.8.1
slug: esphome-mcp
description: >-
  MCP (Model Context Protocol) server exposing ESPHome operations as tools for
  Claude Code. By default it delegates builds/flashes to the ESPHome Device
  Builder dashboard (official ESPHome add-on) so it uses current ESPHome, and
  falls back to a bundled esphome toolchain when the dashboard is unavailable.
  Direct filesystem access to /config/esphome — no SSH.
url: https://github.com/ojkaas/ha-addon-esphome-mcp
arch:
  - aarch64
  - amd64
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: MCP Streamable HTTP endpoint
map:
  - config:rw
options:
  auth_token: ""
  dashboard_url: ""
  dashboard_token: ""
  build_backend: "auto"
  esphome_version: ""
schema:
  auth_token: str
  dashboard_url: str
  dashboard_token: str
  build_backend: "list(auto|dashboard|bundled)"
  esphome_version: "str?"
startup: application
boot: auto
init: false
# host_network so the add-on can reach the ESPHome Device Builder dashboard on
# 127.0.0.1:<ingress_port>. The dashboard runs host-network + ingress-only and
# its peer guard trusts ONLY loopback/supervisor, so a bridge-network add-on
# gets 403. This mirrors how HA core's ESPHome integration reaches it.
host_network: true
ingress: false
# hassio_api lets the add-on query the Supervisor for the ESPHome Device Builder
# dashboard's ingress port, so dashboard_url can be auto-discovered (see
# server/discover.py) instead of hard-coded. The port is install-specific and
# changes on reinstall, so there is no correct fixed default.
hassio_api: true
panel_icon: mdi:chip
